# Lightweight checks on every push.
#
# A push here is not a save point - work in progress lives in a local repository -
# so these exist only to tell you what state the code you pushed is in. Nothing
# here blocks a push, modifies a commit, or requires a pull request.
#
# Three separate jobs rather than one `./gradlew check`, deliberately:
#   - `check` aggregates spotlessCheck with the tests, which mixes formatting
#     failures up with test failures and entangles formatting with test-running
#   - separate jobs mean the status icons tell you which kind of problem you have
#     without opening a log, and one red job cannot stop the others running
#
# Expected states:
#   unit-tests  red means a real regression. Act on it.
#   format      red means you have not run spotlessApply recently. Informational.
#   lint        never goes red. Advisory only, see below.
#
# If this does not work first time, which is entirely possible for anything you
# cannot run locally, deleting this file costs you nothing: none of it is
# required for the project to build, test or release.
#
# These jobs deliberately have no Android SDK setup step. The runner images ship the
# SDK with its licences already accepted, and sdkmanager is not on PATH anyway - it
# lives under $ANDROID_HOME/cmdline-tools - so an "accept licences" step here only
# ever printed "command not found". Gradle downloads whatever else it needs. If a job
# ever does fail on a licence, the fix is the absolute path to sdkmanager, not a new
# dependency.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Monthly, so toolchain and platform drift get noticed even in a month where
  # nothing was pushed. This is a backstop for bit-rot, not a test of the code.
  schedule:
    - cron: '23 5 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only is all these need, so a compromised dependency or a bad action cannot
# push to your repository.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # `test` would also run the release unit tests, which are the same tests
      # again for no extra signal. `check` is avoided for the reason at the top.
      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Reports whether the tree matches ktfmt. Does not change anything. Fix
      # locally with spotlessApply and push again.
      - name: Spotless check
        run: ./gradlew spotlessCheck

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Never fails this workflow, whatever lint finds. Android Lint reports
    # hundreds of checks and, on Compose code in particular, a good number of
    # them are either wrong or not worth acting on. There is no value in a
    # permanent red for findings you have decided not to act on, so this is
    # information rather than a gate - read it when convenient, ignore it
    # otherwise.
    #
    # Deleting this job is the honest alternative if it stops being even
    # marginally interesting.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Android lint
        run: ./gradlew lintDebug