# Everything, only for an "rc*" tag.
#
# A release candidate is the point at which code becomes a release, so this is where the
# expensive and fragile checks belong: the release build under R8, and the instrumented
# tests on an emulator. Keeping them off ordinary pushes is what makes them tolerable to
# maintain - they get their attention when the answer matters, and not on a day when you
# only wanted to know the code still compiles.
#
# An "rc" TAG rather than a "v" tag, deliberately. F-Droid and Obtainium both watch this
# repository for release signals, and tags are what a "v"-prefixed name means to them. Naming
# this workflow's trigger "rc" keeps the act of asking "is this probably shippable?" entirely
# separate from the act of announcing a release: an rc tag is not a release, and nothing
# outside this repository treats it as one.
#
# The convention that makes that safe is: never move or delete an rc tag. If a candidate fails,
# fix the problem and tag again as the next number (rc2.0-1, then rc2.0-2). Moving a tag
# rewrites published history and would be the thing that actually upset an external observer;
# adding one more tag is harmless and leaves a record of what was tried.
#
# workflow_dispatch is the other way in, for checking a candidate without spending a tag on it.
#
# This workflow does NOT build anything you would ship. (It does upload test reports as an
# Actions artefact when something fails - that is not a release artefact.) Shippable builds are
# signed by hand in Android Studio and cannot be produced here at all, because a keystore
# password cannot be typed into CI. See the release build type in app/build.gradle.kts.
#
# So this only answers two questions: "would the release build survive minification, and do the
# tests still pass when the app is actually running?".
name: Release check

on:
  push:
    tags:
      - 'rc*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Each rc tag is its own ref, so two candidates never share a group and never cancel each
  # other - which is the behaviour we want, since they are separate attempts rather than
  # successive states of one thing.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-check:
    name: Release build and instrumented tests
    runs-on: ubuntu-latest
    # A full run is ~10 minutes. Kept sequential rather than split into parallel
    # jobs: the wall-clock saving is not worth the extra machinery, and one job is
    # one place to look when something goes wrong.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # No android-actions/setup-android, and no licence-accepting step either. The
      # runner images ship the Android SDK with the licences already accepted, and
      # sdkmanager is not on PATH anyway - it lives under $ANDROID_HOME/cmdline-tools -
      # so such a step only ever printed "command not found". Gradle downloads
      # whatever else it needs. The action is absent because it reinstalled what the
      # image already had and then asked for the old 'tools' package, which Google no
      # longer serves, so sdkmanager exited 1 and the job failed there.

      # The check that earns this workflow its existence. Release enables R8 and
      # resource shrinking with no custom ProGuard rules, so a stripped class
      # gives you an APK that builds clean and passes the JVM tests and the
      # instrumented tests - those run against debug, and debug is not minified -
      # and then misbehaves in the one build you actually ship. Nothing cheaper
      # catches this.
      #
      # What it does and does not catch, precisely: `assembleRelease` proves the release
      # variant still compiles under R8 with no keep rules, which is the check that
      # breaks on toolchain upgrades. It does NOT prove that the minified build behaves
      # correctly — the instrumented tests below run against the debug variant, which is
      # not minified. A resource the shrinker removed, or a class stripped and reached only
      # reflectively, would pass this workflow and fail in an APK somebody publishes.
      # app/src/main/keepRules/rules.keep records the audit that currently makes that
      # acceptable.
      - name: Assemble release
        run: ./gradlew assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          # The action defaults this to 32-bit x86, but Google stopped publishing
          # 32-bit system images after API 30, so the default names a package
          # that does not exist and the install step fails on it.
          arch: x86_64
          # pixel_2, not pixel_7_pro, on purpose. There is no GPU on a CI runner, so every
          # frame is rendered by SwiftShader on the CPU, and that cost scales with pixel count:
          # 1440x3120 (pixel_7_pro) is 4.5 megapixels against this profile's 2.1, so roughly 2.2x
          # the rendering work per frame. On a contended runner that was enough to leave the
          # instrumented tests flaky - screens recomposing late enough that assertions ran
          # against a stale merged semantics tree.
          #
          # Layout is not compromised: both profiles are 411dp wide, so horizontal layout, text
          # wrapping and line breaking are identical. Only the height differs (891dp vs 731dp), so
          # a tall list shows fewer rows before the fold.
          #
          # TODO.md records what to do if this ever needs revisiting. Switch back to
          # `pixel_7_pro` if a larger viewport is ever wanted deliberately.
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600

          # This REPLACES the action's whole default option string rather than being
          # added to it, so the other flags have to be repeated here.
          #
          # The default is `-gpu swiftshader_indirect`, which Google deprecated in
          # emulator 36.4.9. On the runner it produced a broken renderer - "Failed to
          # find ColorBuffer" and "Failed to bind to texture: invalid color buffer" -
          # and a run 2.5x slower than the same tests on a local machine. Compose
          # recomputes the MERGED semantics tree during layout and draw, so with frames
          # stalled the merged tree lags the unmerged one and assertions fail with
          # "the unmerged tree contains 1 node that matches". That was six instrumented
          # tests; the rest of the 112 passed, so it was the renderer and not the app.
          #
          # `swiftshader` is the supported successor and covers both GLES and Vulkan,
          # the latter being what this image actually used.
          emulator-options: >-
            -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim

          script: ./gradlew connectedDebugAndroidTest

      # Only if something actually failed, and only when the run failed rather
      # than merely having failures in it.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 14